org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Build speed only — outputs are identical: reuse task outputs where possible
# (local task-output cache; cross-run reuse comes from the setup-gradle
# action restoring Gradle home). Configuration cache is a follow-up: it
# needs its own reuse evidence before it rides along.
org.gradle.caching=true

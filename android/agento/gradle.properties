org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Build speed only — outputs are identical: reuse task outputs across runs,
# and reuse the configuration-phase result (startup + dependency resolution
# is ~1min of every CI run; the cache action persists it).
org.gradle.caching=true
org.gradle.configuration-cache=true

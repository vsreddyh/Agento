# NOTE: unreferenced reference template — nothing in scripts/, compose, or the
# entrypoint reads this file (per-profile config comes from
# gateway/config.yaml.template). Kept for local Hermes CLI parity.
model:
  default: ${HERMES_MODEL}
  provider: custom
  base_url: ${HERMES_BASE_URL}
  api_key: ${HERMES_API_KEY}

auxiliary:
  vision:
    model: ling-3.0-flash-fin-free

agent:
  max_turns: ${HERMES_MAX_TURNS}
  reasoning_effort: ${HERMES_REASONING}
  disabled_toolsets:
${HERMES_DISABLED_YAML}
terminal:
  backend: ${HERMES_TERMINAL_BACKEND}
  cwd: .
  timeout: ${HERMES_TERMINAL_TIMEOUT}
  home_mode: auto
  lifetime_seconds: 300
approvals:
  mode: smart

browser:
  inactivity_timeout: 120

session_reset:
  mode: idle
  idle_minutes: 1440
  at_hour: 4

curator:
  enabled: true
  interval_hours: 24
  stale_after_days: 30
  archive_after_days: 45
  consolidate: false

stt:
  enabled: true
  provider: local
  local:
    model: base

updates:
  pre_update_backup: false
  backup_keep: 3
  non_interactive_local_changes: stash

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
display:
  compact: false
  skin: default
  streaming: true
  show_reasoning: false
  tool_progress: all
memory:
  memory_enabled: ${HERMES_MEMORY_ENABLED}
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
security:
  redact_secrets: true
code_execution:
  timeout: 300
  max_tool_calls: 50
hooks_auto_accept: true

hooks: {}

goals:
  max_turns: 20

tts:
  provider: edge
  edge:
    voice: en-US-AriaNeural

streaming:
  enabled: false
prompt_caching:
  cache_ttl: 5m
onboarding:
  seen:
    openclaw_residue_cleanup: true
    profile_build_offered: true

group_sessions_per_user: false

platform_toolsets:
  cli:
    - file
    - terminal

_config_version: 33

name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

# Publishing GitHub Releases (APKs under the repo's Releases page) needs this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/agento
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Single source of truth: android/agento/VERSION (read by Gradle too —
      # no fallbacks anywhere, so tag, release, and APK can never disagree).
      # Version-only scheme: tag agento-v<version> (e.g. agento-v0.3.0), no
      # build numbers; versionCode derives from semver in Gradle. Same-version
      # rebuilds upsert the existing Release.
      - name: Resolve version
        id: version
        run: |
          NAME=$(cat VERSION)
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=agento-v${NAME}" >> "$GITHUB_OUTPUT"

      # Stable signature is REQUIRED for the in-app updater: Android refuses
      # an update signed with a different key. Add these repo secrets once
      # (Settings → Secrets → Actions) with your upload keystore:
      #   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them CI falls back to a throwaway debug keystore, and those
      # APKs will NOT install over each other as updates.
      # No setup-android step: ubuntu runners ship a preinstalled SDK, and
      # android-actions/setup-android@v3 installs the long-removed `tools`
      # package (sdkmanager exit 1). Gradle finds the SDK via ANDROID_HOME.
      - name: Set up signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/upload.keystore
            echo "KEYSTORE_PATH=$HOME/.android/upload.keystore" >> "$GITHUB_ENV"
            echo "Using upload keystore from secrets."
          else
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signed with throwaway debug key; APKs won't install as updates."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # main builds release ONLY; branches/PRs build debug ONLY (faster CI,
      # and release signing stays on main). The verify step below enforces
      # that the built APK filename matches the resolved version.
      - name: Build APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Fails the job if Gradle's output filename doesn't match the release
      # version — a drift here must never publish a mislabeled Release.
      - name: Verify version consistency
        run: |
          EXPECTED="agento-${{ steps.version.outputs.version_name }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            test -f "app/build/outputs/apk/release/$EXPECTED-release.apk"
          else
            test -f "app/build/outputs/apk/debug/$EXPECTED-debug.apk"
          fi
          echo "Version consistent: $EXPECTED"

      - name: Upload debug APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agento-${{ steps.version.outputs.version_name }}-debug
          path: android/agento/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agento-${{ steps.version.outputs.version_name }}-release
          path: android/agento/app/build/outputs/apk/release/*.apk

      # Publishes the release APK under the repo's Releases page with patch
      # notes (custom body below + auto-generated changelog). Only
      # main-branch pushes cut a release so /releases/latest always points
      # at the newest main build; PR/branch builds stop at artifacts above.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Agento ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          body: |
            ## Agento `${{ steps.version.outputs.version_name }}`

            Install `agento-${{ steps.version.outputs.version_name }}-release.apk` on your phone — or tap **Check for updates** in Agento → Settings to pull it in-app.

            Upgrading from ≤0.2.x? Set Server URL to the proxy (`http://<host>:8080`) and Password to `HEALTH_SYNC_TOKEN` — the old API key no longer authenticates chat.

            ### Changes
          files: |
            android/agento/app/build/outputs/apk/release/*.apk

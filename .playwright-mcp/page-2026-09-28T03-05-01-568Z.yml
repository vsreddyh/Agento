      - generic [ref=e187]:
        - article [ref=e188]:
          - heading "Effective Reminder Feature" [level=1] [ref=e189]
          - generic [ref=e190]:
            - paragraph [ref=e191]: When you set a "reminder" for your task, you will be reminded on time according to the reminder time you set, which helps you efficiently complete various tasks.
            - heading [level=2] [ref=e192]:
              - link "How to set a reminder" [ref=e193] [cursor=pointer]:
                - /url: "#how-to-set-a-reminder"
            - list [ref=e194]:
              - listitem [ref=e195]:
                - paragraph [ref=e196]: "Option 1: When creating a task, click the calendar icon below the title and select \"Set Reminder.\""
              - listitem [ref=e197]:
                - paragraph [ref=e198]: "Option 2: Enter the task details page, click \"Date & Reminder\" above the task title, and select \"Reminder.\""
            - figure [ref=e199]
            - paragraph [ref=e200]: You can also set "multiple reminders" for the task.
            - figure [ref=e201]
            - group [ref=e202]:
              - generic "How to set a custom reminder time?" [ref=e203] [cursor=pointer]
            - group [ref=e210]:
              - generic "How to set the same reminder for a task?" [ref=e211] [cursor=pointer]
            - heading [level=2] [ref=e218]:
              - link "Reminder Pop-up" [ref=e219] [cursor=pointer]:
                - /url: "#reminder-pop-up"
            - paragraph [ref=e220]: After setting a reminder time for a task, TickTick will remind you to complete the task on time.
            - paragraph [ref=e221]: A "reminder pop-up" will appear to remind you to handle the task. You can choose "Dismiss", "Start Focus", "Done", or "Snooze" based on your actual situation.
            - paragraph [ref=e222]: In addition to receiving reminders within the app, you can also receive reminder pop-ups outside the app and when the screen is locked.
            - group [ref=e223]:
              - generic "Why didn't I receive a reminder?" [ref=e224] [cursor=pointer]
            - group [ref=e231]:
              - generic "Why didn't the task remind me on time?" [ref=e232] [cursor=pointer]
            - heading [level=2] [ref=e239]:
              - link "Email Notifications" [ref=e240] [cursor=pointer]:
                - /url: "#email-notifications"
            - paragraph [ref=e241]:
              - text: "You can log in to our web version:"
              - link "ticktick.com" [ref=e242] [cursor=pointer]:
                - /url: http://ticktick.com
              - text: "- click on your Avatar - Settings - Reminders & Notifications, and enable Email Notifications."
            - heading [level=2] [ref=e243]:
              - link "Task reminders for more scenarios" [ref=e244] [cursor=pointer]:
                - /url: "#task-reminders-for-more-scenarios"
            - heading [level=3] [ref=e245]:
              - link "Location Reminder" [ref=e246] [cursor=pointer]:
                - /url: "#location-reminder"
            - paragraph [ref=e247]: Do you have tasks that require you to be in a specific location to complete, such as "go to the print shop to copy the company's brochure," but in reality, you forget about it completely when passing by the print shop?
            - paragraph [ref=e248]: The "Location Reminder" feature can help you.
            - list [ref=e249]:
              - listitem [ref=e250]:
                - paragraph [ref=e251]: Create a task such as "Go to the print shop to copy the company's brochure," enter the task details page, click on the top right corner "..." - "Location", and enter the print shop location.
              - listitem [ref=e252]:
                - paragraph [ref=e253]: After setting it up successfully, when you arrive at the print shop location, TickTick will automatically remind you.
                - figure [ref=e254]
            - blockquote [ref=e255]:
              - paragraph [ref=e256]: The "Location Reminder" feature is currently only available on iOS and Android applications.
            - heading [level=3] [ref=e257]:
              - link "End Time Reminder" [ref=e258] [cursor=pointer]:
                - /url: "#end-time-reminder"
            - paragraph [ref=e259]: When you have a meeting or event scheduled, how can you easily know when it's about to end and avoid running over?
            - paragraph [ref=e260]: After setting the task's duration, choose "Reminder," and check the "At the end" option. Once set, you'll get a reminder at the task's end time.
            - figure [ref=e261]
            - heading [level=2] [ref=e262]:
              - link "How to set Reminder Ringtone" [ref=e263] [cursor=pointer]:
                - /url: "#how-to-set-reminder-ringtone"
            - paragraph [ref=e264]: After setting the reminder time for the task, you can select your favorite ringtone in "Settings" - "Sounds & Notifications" - "Reminder Ringtone".
            - figure [ref=e265]
            - paragraph [ref=e266]: "If you want to set \"different reminder ringtones for tasks with different priorities\": when the time comes, you can distinguish the priority of the task through the ringtone without having to open your phone. You can enable \"Priority Reminder Ringtone\"."
            - figure [ref=e267]

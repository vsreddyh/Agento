          - heading [level=3] [ref=e570]:
            - link "Setting Balances" [ref=e571] [cursor=pointer]:
              - /url: "#setting-balances"
            - button "Copy Anchor Link" [ref=e572]
          - paragraph [ref=e576]: Additionally, you can set a balance for a user. An existing balance will be overwritten by the new balance.
          - figure [ref=e577]:
            - button "Copy Text" [ref=e579]
            - region [ref=e583]:
              - code [ref=e585]:

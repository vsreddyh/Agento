        - heading "Token Usage" [level=1] [ref=e255]
        - paragraph [ref=e256]: This covers how to track and control token usage in LibreChat. You will learn how to view context and cost, configure transactions, enable user balances, and add credits to an account.
        - generic [ref=e257]:
          - button "Copy page as Markdown" [ref=e258]: Copy Markdown
          - button "Open page in external tools" [ref=e262]: Open
        - generic [ref=e265]:
          - heading [level=2] [ref=e266]:
            - link "Intro" [ref=e267] [cursor=pointer]:
              - /url: "#intro"
            - button "Copy Anchor Link" [ref=e268]
          - paragraph [ref=e272]:
            - text: As of
            - code [ref=e273]: v0.6.0
            - text: ", LibreChat accurately tracks token usage for supported endpoints. All token transactions are stored in the \"Transactions\" collection in your database. Current releases also show real-time context usage and cost in the conversation UI when enabled."
          - paragraph [ref=e274]:
            - text: Currently, you can limit user token usage by enabling user balances. Instead of configuring token credit limits via environment variables, you now set these options in your
            - code [ref=e275]: librechat.yaml
            - text: file under the
            - strong [ref=e276]: balance
            - text: section. Cost values are hidden by default and must be enabled with
            - code [ref=e277]: interface.contextCost
            - text: .
          - heading [level=2] [ref=e278]:
            - link "Viewing Context Usage and Cost" [ref=e279] [cursor=pointer]:
              - /url: "#viewing-context-usage-and-cost"
            - button "Copy Anchor Link" [ref=e280]
          - paragraph [ref=e284]: "LibreChat shows a context gauge while a conversation is running. The gauge updates from usage events during streaming and can show:"
          - list [ref=e285]:
            - listitem [ref=e286]: Current prompt/context usage against the model's context window
            - listitem [ref=e287]: A hover summary for quick token and cost details
            - listitem [ref=e288]: A color-coded meter that separates the token categories currently using the context window
            - listitem [ref=e289]: A click-through breakdown for dialogue, retained tool results, Agent instructions, cached input, completions, branch totals, and conversation totals
            - listitem [ref=e290]: Per-tool disclosures and a runway estimate when compatible snapshots can project remaining context pressure
            - listitem [ref=e291]: For authorized administrators, a direct Langfuse session link when the conversation has a sampled trace in the active in-app connection
          - paragraph [ref=e292]: The detailed breakdown is collapsed by default so the categorized meter remains compact. Users can expand it when they need the totals and LibreChat remembers that choice for later conversations. Deferred tool definitions use the same category color with a hatched treatment, while estimates without a known category composition remain a single fill.
          - paragraph [ref=e293]: Tool traffic, cache, and Agent instructions are subsets of their containing categories and do not increase the total a second time. The runway estimate appears only when consecutive snapshots share the same model, provider, Agent, context budget, and fixed overhead. Usage breakdowns are persisted with messages and conversations, including the final primary call's cache split and completed output. Reopened chats retain branch and total usage/cost details instead of relying only on the active streaming session; Subagent totals are explicitly labeled as covering all branches.
          - paragraph [ref=e294]: When summarization compacts a long conversation, LibreChat records the compacted summary baseline and counts only post-summary turns on top of it for the context gauge. Usage and cost totals still include the full branch spend.
          - paragraph [ref=e295]:
            - text: Admins can control these displays in
            - code [ref=e296]: librechat.yaml
            - text: ":"
          - figure [ref=e297]:
            - button "Copy Text" [ref=e299]
            - region [ref=e303]:
              - code [ref=e305]:
                - generic [ref=e306]: "interface:"
                - generic [ref=e307]: "contextUsage: true"
                - generic [ref=e308]: "contextCost: true"
                - generic [ref=e309]: "currency:"
                - generic [ref=e310]: "code: EUR"
                - generic [ref=e311]: "rate: 0.92"
          - list [ref=e312]:
            - listitem [ref=e313]:
              - code [ref=e314]: contextUsage
              - text: controls whether users see the context window and token usage gauge.
            - listitem [ref=e315]:
              - code [ref=e316]: contextCost
              - text: controls whether users see cost values in the usage details. It defaults to
              - code [ref=e317]: "false"
              - text: ; set it to
              - code [ref=e318]: "true"
              - text: to show costs.
            - listitem [ref=e319]:
              - code [ref=e320]: currency
              - text: converts displayed USD costs using a static multiplier when cost display is enabled. Transactions are still recorded using LibreChat's token credit accounting.
          - heading [level=2] [ref=e321]:
            - link "Custom Endpoint Token Config" [ref=e322] [cursor=pointer]:
              - /url: "#custom-endpoint-token-config"
            - button "Copy Anchor Link" [ref=e323]
          - paragraph [ref=e327]:
            - text: For custom endpoints, define model-specific context windows and per-million-token rates with
            - code [ref=e328]: endpoints.custom[].tokenConfig
            - text: ":"
          - figure [ref=e329]:
            - button "Copy Text" [ref=e331]
            - region [ref=e335]:
              - code [ref=e337]:
                - generic [ref=e338]: "endpoints:"
                - generic [ref=e339]: "custom:"
                - generic [ref=e340]: "- name: 'Mistral'"
                - generic [ref=e341]: "apiKey: '${MISTRAL_API_KEY}'"
                - generic [ref=e342]: "baseURL: 'https://api.mistral.ai/v1'"
                - generic [ref=e343]: "models:"
                - generic [ref=e344]: "default: ['mistral-large-latest']"
                - generic [ref=e345]: "tokenConfig:"
                - generic [ref=e346]: "mistral-large-latest:"
                - generic [ref=e347]: "prompt: 2"
                - generic [ref=e348]: "completion: 6"
                - generic [ref=e349]: "context: 128000"
          - paragraph [ref=e350]:
            - code [ref=e351]: prompt
            - text: ","
            - code [ref=e352]: completion
            - text: ", and"
            - code [ref=e353]: context
            - text: are required for each model entry.
            - code [ref=e354]: cacheRead
            - text: and
            - code [ref=e355]: cacheWrite
            - text: can be added for providers that report cached input usage. For Agents that use multiple endpoints, LibreChat uses the matching endpoint/model token config when recording usage and cost.
          - paragraph [ref=e356]: Fetched token config is cached with user scope when endpoint models, keys, URLs, or headers can vary by request context, so isolated custom endpoint pricing and context windows stay separated.
          - heading [level=2] [ref=e357]:
            - link "Transaction Configuration" [ref=e358] [cursor=pointer]:
              - /url: "#transaction-configuration"
            - button "Copy Anchor Link" [ref=e359]
          - paragraph [ref=e363]: The transaction system controls whether token usage records are saved to the database. This can be configured separately from the balance system.
          - heading [level=3] [ref=e364]:
            - link "Transaction Settings" [ref=e365] [cursor=pointer]:
              - /url: "#transaction-settings"
            - button "Copy Anchor Link" [ref=e366]
          - figure [ref=e370]:
            - button "Copy Text" [ref=e372]
            - region [ref=e376]:
              - code [ref=e378]:
                - generic [ref=e379]: "version: 1.2.9"
                - generic [ref=e381]: "# Transaction settings"
                - generic [ref=e382]: "# Controls whether to save transaction records to the database"
                - generic [ref=e383]: "# Default is true (enabled)"
                - generic [ref=e384]: "transactions:"
                - generic [ref=e385]: "enabled: false"
          - paragraph [ref=e386]:
            - strong [ref=e387]: "Important:"
            - text: When
            - code [ref=e388]: balance.enabled
            - text: is set to
            - code [ref=e389]: "true"
            - text: ", transaction recording is automatically enabled regardless of the"
            - code [ref=e390]: transactions.enabled
            - text: setting. This ensures that balance tracking functions correctly by maintaining a complete record of all token usage.
          - paragraph [ref=e391]:
            - text: Check out the
            - link "Transactions Configuration" [ref=e392] [cursor=pointer]:
              - /url: /docs/configuration/librechat_yaml/object_structure/transactions
            - text: page for more details.
          - heading [level=2] [ref=e393]:
            - link "Balance Configuration" [ref=e394] [cursor=pointer]:
              - /url: "#balance-configuration"
            - button "Copy Anchor Link" [ref=e395]
          - paragraph [ref=e399]:
            - text: The balance system in LibreChat allows administrators to configure how token credit balances are managed for users. All balance settings are now managed in your YAML configuration under the
            - code [ref=e400]: balance
            - text: object.
          - paragraph [ref=e401]:
            - strong [ref=e402]: "Note:"
            - text: This replaces the previous environment variables (
            - code [ref=e403]: CHECK_BALANCE
            - text: and
            - code [ref=e404]: START_BALANCE
            - text: ) and provides a more structured way to manage user balances.
          - heading [level=3] [ref=e405]:
            - link "Complete Balance Settings" [ref=e406] [cursor=pointer]:
              - /url: "#complete-balance-settings"
            - button "Copy Anchor Link" [ref=e407]
          - figure [ref=e411]:
            - button "Copy Text" [ref=e413]
            - region [ref=e417]:
              - code [ref=e419]:
                - generic [ref=e420]: "version: 1.3.5"
                - generic [ref=e422]: "# Balance settings"
                - generic [ref=e423]: "balance:"
                - generic [ref=e424]: "enabled: true # Enable token credit balances for users"
                - generic [ref=e425]: "startBalance: 20000 # Initial tokens credited upon registration"
                - generic [ref=e426]: "autoRefillEnabled: false # Enable automatic token refills"
                - generic [ref=e427]: "refillIntervalValue: 30 # Numerical value for refill interval"
                - generic [ref=e428]: "refillIntervalUnit: 'days' # Time unit for refill interval (days, hours, etc.)"
                - generic [ref=e429]: "refillAmount: 10000 # Tokens added during each refill"
          - heading [level=3] [ref=e430]:
            - link "Balance Settings Explained" [ref=e431] [cursor=pointer]:
              - /url: "#balance-settings-explained"
            - button "Copy Anchor Link" [ref=e432]
          - list [ref=e436]:
            - listitem [ref=e437]:
              - paragraph [ref=e438]:
                - strong [ref=e439]: enabled
                - text: ": Activates token credit tracking and balance management for users. When set to"
                - code [ref=e440]: "true"
                - text: ", the system will track token usage and enforce balance limits."
            - listitem [ref=e441]:
              - paragraph [ref=e442]:
                - strong [ref=e443]: startBalance
                - text: ": Specifies the initial number of tokens credited to a user upon registration. This is the starting balance for all new users."
            - listitem [ref=e444]:
              - paragraph [ref=e445]:
                - strong [ref=e446]: autoRefillEnabled
                - text: ": Determines whether automatic refilling of token credits is enabled. When set to"
                - code [ref=e447]: "true"
                - text: ", the system will automatically add credits to user balances based on the refill interval."
            - listitem [ref=e448]:
              - paragraph [ref=e449]:
                - strong [ref=e450]: refillIntervalValue
                - text: ": Specifies the numerical value for the interval at which token credits are automatically refilled. Works in conjunction with"
                - code [ref=e451]: refillIntervalUnit
                - text: .
            - listitem [ref=e452]:
              - paragraph [ref=e453]:
                - strong [ref=e454]: refillIntervalUnit
                - text: ": Specifies the time unit for the refill interval. Supported values include \"seconds\", \"minutes\", \"hours\", \"days\", \"weeks\", and \"months\"."
            - listitem [ref=e455]:
              - paragraph [ref=e456]:
                - strong [ref=e457]: refillAmount
                - text: ": Specifies the number of tokens to be added to the user's balance during each automatic refill."
          - paragraph [ref=e458]:
            - text: Check out the
            - link "Balance Configuration" [ref=e459] [cursor=pointer]:
              - /url: /docs/configuration/librechat_yaml/object_structure/balance
            - text: page for more details.
          - heading [level=2] [ref=e460]:
            - link "How Auto-Refill Works" [ref=e461] [cursor=pointer]:
              - /url: "#how-auto-refill-works"
            - button "Copy Anchor Link" [ref=e462]
          - paragraph [ref=e466]:
            - text: When a user's balance is tracked and
            - strong [ref=e467]: autoRefill
            - text: is enabled, the system will automatically add credits to the balance only when the specified time interval has passed since the last refill. This is achieved by comparing the current date with the
            - code [ref=e468]: lastRefill
            - text: date plus the specified interval.
          - heading [level=3] [ref=e469]:
            - link "Auto-Refill Process" [ref=e470] [cursor=pointer]:
              - /url: "#auto-refill-process"
            - button "Copy Anchor Link" [ref=e471]
          - list [ref=e475]:
            - listitem [ref=e476]: When a user attempts to spend tokens, the system checks if the current balance is sufficient
            - listitem [ref=e477]: If the balance would drop to zero or below after the transaction, the system checks if auto-refill is enabled
            - listitem [ref=e478]:
              - text: "If auto-refill is enabled, the system checks if the time interval since the last refill has passed:"
              - list [ref=e479]:
                - listitem [ref=e480]:
                  - text: The system compares the current date with
                  - code [ref=e481]: lastRefill + refillInterval
                - listitem [ref=e482]: If the interval has passed, tokens are added to the user's balance
                - listitem [ref=e483]:
                  - text: The
                  - code [ref=e484]: lastRefill
                  - text: date is updated to the current date
            - listitem [ref=e485]: The transaction proceeds if the balance is sufficient (either originally or after refill)
          - heading [level=3] [ref=e486]:
            - link "Supported Time Units" [ref=e487] [cursor=pointer]:
              - /url: "#supported-time-units"
            - button "Copy Anchor Link" [ref=e488]
          - paragraph [ref=e492]:
            - text: The
            - code [ref=e493]: refillIntervalUnit
            - text: "can be set to any of the following values:"
          - list [ref=e494]:
            - listitem [ref=e495]: "\"seconds\""
            - listitem [ref=e496]: "\"minutes\""
            - listitem [ref=e497]: "\"hours\""
            - listitem [ref=e498]: "\"days\""
            - listitem [ref=e499]: "\"weeks\""
            - listitem [ref=e500]: "\"months\""
          - paragraph [ref=e501]:
            - text: For example, if
            - code [ref=e502]: refillIntervalValue
            - text: is set to 30 and
            - code [ref=e503]: refillIntervalUnit
            - text: is
            - code [ref=e504]: days
            - text: ", the system will add"
            - code [ref=e505]: refillAmount
            - text: tokens to the user's balance only if 30 days have passed since the last refill.
          - heading [level=3] [ref=e506]:
            - link "Balance Synchronization" [ref=e507] [cursor=pointer]:
              - /url: "#balance-synchronization"
            - button "Copy Anchor Link" [ref=e508]
          - paragraph [ref=e512]: When a user logs in, the system automatically synchronizes their balance settings with the current global balance configuration. This ensures that any changes to the balance configuration are applied to all users.
          - paragraph [ref=e513]: "The synchronization process:"
          - list [ref=e514]:
            - listitem [ref=e515]: Checks if the user has a balance record
            - listitem [ref=e516]:
              - text: If no record exists, creates one with the current
              - code [ref=e517]: startBalance
            - listitem [ref=e518]: Updates the user's auto-refill settings to match the global configuration
            - listitem [ref=e519]: Ensures the user's refill interval and amount match the global settings
          - heading [level=2] [ref=e520]:
            - link "Managing Token Balances" [ref=e521] [cursor=pointer]:
              - /url: "#managing-token-balances"
            - button "Copy Anchor Link" [ref=e522]
          - paragraph [ref=e526]: You can manually add or set user balances. This is especially useful during development or if you plan to build out a full balance-accruing system in the future (for example, via an admin dashboard).
          - heading [level=3] [ref=e527]:
            - link "Adding Balances" [ref=e528] [cursor=pointer]:
              - /url: "#adding-balances"
            - button "Copy Anchor Link" [ref=e529]
          - figure [ref=e533]:
            - button "Copy Text" [ref=e535]
            - region [ref=e539]:
              - code [ref=e541]:
                - generic [ref=e542]: "# Local Development"
                - generic [ref=e543]: npm run add-balance
                - generic [ref=e545]: "# Docker (default setup)"
                - generic [ref=e546]: docker compose exec api npm run add-balance
                - generic [ref=e548]: "# Docker (deployment setup)"
                - generic [ref=e549]: docker exec -it LibreChat-API /bin/sh -c "cd .. && npm run add-balance"
          - figure [ref=e550]:
            - button "Copy Text" [ref=e552]

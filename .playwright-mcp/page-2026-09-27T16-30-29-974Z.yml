        - generic [ref=f3e196]:
          - generic [ref=f3e198]:
            - heading "Add UI to your MCP server" [level=1] [ref=f3e200]
            - paragraph [ref=f3e201]: Return optional UI resources from selected MCP tools.
          - article [ref=f3e202]:
            - heading "Overview Copy link to Overview" [level=2] [ref=f3e203]:
              - generic [ref=f3e204]: Overview
              - button "Copy link to Overview" [ref=f3e205] [cursor=pointer]
            - paragraph [ref=f3e208]: Custom UI is optional. Add it when a plugin use case requires people to inspect, compare, edit, confirm, or navigate structured information. Keep the MCP tools useful without a component so ChatGPT and Codex can complete the workflow without UI.
            - paragraph [ref=f3e209]:
              - text: The MCP server returns UI resources for selected tools. Components run inside an iframe in ChatGPT, communicate with the host through the MCP Apps bridge (JSON-RPC over
              - code [ref=f3e210]: postMessage
              - text: ), and render alongside the conversation. The open MCP Apps standard lets the UI run across compatible hosts.
            - heading "Start with MCP Apps Copy link to Start with MCP Apps" [level=2] [ref=f3e211]:
              - generic [ref=f3e212]: Start with MCP Apps
              - button "Copy link to Start with MCP Apps" [ref=f3e213] [cursor=pointer]
            - paragraph [ref=f3e216]:
              - text: ChatGPT implements the open
              - link "MCP Apps standard" [ref=f3e217] [cursor=pointer]:
                - /url: https://modelcontextprotocol.io/docs/extensions/apps
              - text: for UI returned by an MCP server. MCP Apps defines how your server associates tools with UI resources and how the iframe communicates with its host.
            - paragraph [ref=f3e218]: "For new UI:"
            - list [ref=f3e219]:
              - listitem [ref=f3e220]:
                - text: Declare the UI resource with
                - code [ref=f3e221]: _meta.ui.resourceUri
                - text: .
              - listitem [ref=f3e222]:
                - text: Use the
                - code [ref=f3e223]: ui/*
                - text: JSON-RPC bridge over
                - code [ref=f3e224]: postMessage
                - text: for initialization, notifications, tool calls, messages, and model-visible context.
              - listitem [ref=f3e225]: Keep tools useful without UI so the model can complete the workflow in clients that do not render components.
            - paragraph [ref=f3e226]: This standards-first foundation lets the same UI run in ChatGPT and other compatible MCP Apps hosts.
            - paragraph [ref=f3e227]:
              - text: When you’re ready to implement the standard, use the
              - link "MCP Apps specification" [ref=f3e228] [cursor=pointer]:
                - /url: https://modelcontextprotocol.io/docs/extensions/apps
              - text: .
            - heading "Layer on ChatGPT extensions Copy link to Layer on ChatGPT extensions" [level=2] [ref=f3e229]:
              - generic [ref=f3e230]: Layer on ChatGPT extensions
              - button "Copy link to Layer on ChatGPT extensions" [ref=f3e231] [cursor=pointer]
            - paragraph [ref=f3e234]:
              - text: After the MCP Apps flow works, use
              - code [ref=f3e235]: window.openai
              - text: only for capabilities that the shared specification does not cover. These optional extensions can improve the experience in ChatGPT without making them part of the portable UI foundation.
            - heading "Prefer shared fields and methods Copy link to Prefer shared fields and methods" [level=3] [ref=f3e236]:
              - generic [ref=f3e237]: Prefer shared fields and methods
              - button "Copy link to Prefer shared fields and methods" [ref=f3e238] [cursor=pointer]
            - paragraph [ref=f3e241]: "Use the MCP Apps field or method whenever the shared specification covers the capability:"
            - table [ref=f3e242]:
              - rowgroup [ref=f3e243]:
                - row [ref=f3e244]:
                  - columnheader "Goal" [ref=f3e245]
                  - columnheader "MCP Apps standard" [ref=f3e246]

                - generic [ref=f3e303]: // Fallback behavior for hosts without this extension.
                - generic [ref=f3e304]: "}"
              - generic [ref=f3e305]:
                - button "Copy code to clipboard" [ref=f3e306] [cursor=pointer]
                - status [ref=f3e309]
            - paragraph [ref=f3e310]: Avoid branching on a host or product name. Test for the capability your UI needs.
            - paragraph [ref=f3e311]:
              - text: For extension signatures and examples, see the
              - link [ref=f3e312] [cursor=pointer]:
                - /url: /plugins/reference#windowopenai-component-bridge
                - code [ref=f3e313]: window.openai
                - text: component bridge reference
              - text: .
            - heading "Optional OpenAI component library Copy link to Optional OpenAI component library" [level=3] [ref=f3e314]:
              - generic [ref=f3e315]: Optional OpenAI component library
              - button "Copy link to Optional OpenAI component library" [ref=f3e316] [cursor=pointer]
            - paragraph [ref=f3e319]:
              - text: The
              - link [ref=f3e320] [cursor=pointer]:
                - /url: https://openai.github.io/apps-sdk-ui/
                - code [ref=f3e321]: "@openai/apps-sdk-ui"
              - text: component library provides ready-made buttons, cards, input controls, and layout primitives that match ChatGPT’s container. Use it when you want consistent styling without rebuilding base components.
            - paragraph [ref=f3e322]:
              - text: You can also explore the
              - link "UI examples repository on GitHub" [ref=f3e323] [cursor=pointer]:
                - /url: https://github.com/openai/openai-apps-sdk-examples
              - text: .
            - heading "Choose a presentation Copy link to Choose a presentation" [level=2] [ref=f3e324]:
              - generic [ref=f3e325]: Choose a presentation
              - button "Copy link to Choose a presentation" [ref=f3e326] [cursor=pointer]
            - paragraph [ref=f3e329]: Start with inline UI and request more space only when the workflow needs it. Choose the smallest presentation that lets people understand the result or complete the task.
            - heading "Inline card Copy link to Inline card" [level=3] [ref=f3e330]:
              - generic [ref=f3e331]: Inline card
              - button "Copy link to Inline card" [ref=f3e332] [cursor=pointer]
            - paragraph [ref=f3e335]: Use an inline card for a focused result, confirmation, or small set of actions. Keep it self-contained and avoid deep navigation.
            - paragraph [ref=f3e336]:
              - img "Examples of inline cards" [ref=f3e337]
            - heading "Inline carousel Copy link to Inline carousel" [level=3] [ref=f3e338]:
              - generic [ref=f3e339]: Inline carousel
              - button "Copy link to Inline carousel" [ref=f3e340] [cursor=pointer]
            - paragraph [ref=f3e343]: Use an inline carousel when people need to scan and choose from a small set of similar, visually rich options.
            - paragraph [ref=f3e344]:
              - img "Example of an inline carousel" [ref=f3e345]
            - heading "fullscreen Copy link to fullscreen" [level=3] [ref=f3e346]:
              - generic [ref=f3e347]: fullscreen
              - button "Copy link to fullscreen" [ref=f3e348] [cursor=pointer]
            - paragraph [ref=f3e351]: Use fullscreen for rich tasks that need more room, such as maps, editing canvases, or detailed browsing. Design the experience to work with ChatGPT’s composer, which remains available in fullscreen.
            - paragraph [ref=f3e352]:
              - img "Example of fullscreen UI" [ref=f3e353]
            - heading "Picture-in-picture Copy link to Picture-in-picture" [level=3] [ref=f3e354]:
              - generic [ref=f3e355]: Picture-in-picture
              - button "Copy link to Picture-in-picture" [ref=f3e356] [cursor=pointer]
            - paragraph [ref=f3e359]: Use picture-in-picture for an ongoing activity that should remain visible while the conversation continues, such as a live session, game, or video.
            - paragraph [ref=f3e360]:
              - img "Example of picture-in-picture UI" [ref=f3e361]
            - paragraph [ref=f3e362]:
              - text: For detailed layout, interaction, visual design, and accessibility guidance, see
              - link "UI guidelines" [ref=f3e363] [cursor=pointer]:
                - /url: /plugins/concepts/ui-guidelines
              - text: .
            - heading "Separate data processing from UI rendering Copy link to Separate data processing from UI rendering" [level=2] [ref=f3e364]:
              - generic [ref=f3e365]: Separate data processing from UI rendering
              - button "Copy link to Separate data processing from UI rendering" [ref=f3e366] [cursor=pointer]
            - heading "Decoupled pattern Copy link to Decoupled pattern" [level=3] [ref=f3e369]:
              - generic [ref=f3e370]: Decoupled pattern
              - button "Copy link to Decoupled pattern" [ref=f3e371] [cursor=pointer]
            - paragraph [ref=f3e374]: "If you attach a widget template to every tool call, ChatGPT can re-render your iframe too often. A better pattern is to separate data-processing tools from render tools:"
            - list [ref=f3e375]:
              - listitem [ref=f3e376]:
                - strong [ref=f3e377]: Data tools
                - text: fetch, compute, or mutate data and return only tool results.
              - listitem [ref=f3e378]:
                - strong [ref=f3e379]: Render tools
                - text: take final data and return the widget template.
            - paragraph [ref=f3e380]: This allows the model to apply its intelligence to data it fetched before choosing to render UI to the user, making it much more likely that it will accomplish the user’s specific expressed goal.
            - paragraph [ref=f3e381]: This pattern is part of the MCP Apps architecture.
            - paragraph [ref=f3e382]: "In practice, many UI integrations use this split:"
            - list [ref=f3e383]:
              - listitem [ref=f3e384]:
                - strong [ref=f3e385]: "Search/fetch tools (data-first):"
                - text: Return IDs plus metadata with no widget template attached.
              - listitem [ref=f3e386]:
                - strong [ref=f3e387]:
                  - text: Render tools (for example,
                  - code [ref=f3e388]: render_listings_widget
                  - text: "):"
                - text: Take a prepared list of IDs and render the widget.
            - paragraph [ref=f3e389]:
              - text: Only the render tool should include
              - code [ref=f3e390]: _meta.ui.resourceUri
              - text: .
            - heading "Decoupled call flow Copy link to Decoupled call flow" [level=3] [ref=f3e391]:
              - generic [ref=f3e392]: Decoupled call flow
              - button "Copy link to Decoupled call flow" [ref=f3e393] [cursor=pointer]
            - paragraph [ref=f3e396]: "Recommended call flow:"
            - list [ref=f3e397]:
              - listitem [ref=f3e398]:
                - text: The model calls the data tool (for example,
                - code [ref=f3e399]: roll_dice
                - text: ).
              - listitem [ref=f3e400]:
                - text: The model receives
                - code [ref=f3e401]: structuredContent
                - text: from the data tool.
              - listitem [ref=f3e402]: The model calls the render tool with that data.
              - listitem [ref=f3e403]: The widget renders once with final, model-checked context.
            - 'heading "Example: Real estate follow-up queries Copy link to Example: Real estate follow-up queries" [level=3] [ref=f3e404]':
              - generic [ref=f3e405]: "Example: Real estate follow-up queries"
              - 'button "Copy link to Example: Real estate follow-up queries" [ref=f3e406] [cursor=pointer]'
            - paragraph [ref=f3e409]:
              - text: Suppose your plugin shows listing cards and a map, but your server-side
              - code [ref=f3e410]: search
              - text: tool only supports broad filters (city, price, beds, baths) and cannot filter by school zone.
            - paragraph [ref=f3e411]: "If a user asks, “Which of these are in the Richmond Primary School zone?” decoupling helps:"
            - list [ref=f3e412]:
              - listitem [ref=f3e413]:
                - code [ref=f3e414]: search
                - text: runs broadly and returns candidate listing IDs plus metadata.
              - listitem [ref=f3e415]: The model refines that candidate set for the follow-up question.
              - listitem [ref=f3e416]:
                - text: The model calls
                - code [ref=f3e417]: render_listings_widget
                - text: with only the filtered IDs.
              - listitem [ref=f3e418]: The widget renders the final filtered set.
            - paragraph [ref=f3e419]: "Best practices:"
            - list [ref=f3e420]:
              - listitem [ref=f3e421]:
                - text: Keep data tools reusable. Return complete
                - code [ref=f3e422]: structuredContent
                - text: for chaining.
              - listitem [ref=f3e423]: Keep render tools focused on presentation. Don’t mix business logic into the render handler.
              - listitem [ref=f3e424]:
                - text: State the dependency in the render tool description (for example, “Always call
                - code [ref=f3e425]: roll_dice

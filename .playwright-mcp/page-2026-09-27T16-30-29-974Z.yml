              - listitem [ref=f3e977]: Taxes, discounts, and fees.
              - listitem [ref=f3e978]: Shipping and fulfillment.
              - listitem [ref=f3e979]: Refunds, support, and compliance.
            - paragraph [ref=f3e980]: Current approval is limited to plugins for physical-goods purchases. Do not offer other commerce categories unless OpenAI has explicitly enabled them for your plugin.

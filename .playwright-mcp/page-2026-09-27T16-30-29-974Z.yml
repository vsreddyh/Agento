            - paragraph [ref=f3e280]: The compatibility aliases remain available for existing integrations. New UI should use the shared fields and bridge methods in the middle column.
            - paragraph [ref=f3e281]: "Examples include:"
            - list [ref=f3e282]:
              - listitem [ref=f3e283]:
                - text: Instant Checkout with
                - code [ref=f3e284]: window.openai.requestCheckout
                - text: .
              - listitem [ref=f3e285]:
                - text: ChatGPT file handling with

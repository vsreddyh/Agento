                - text: ","
                - code [ref=f3e287]: window.openai.selectFiles
                - text: ", and"
                - code [ref=f3e288]: window.openai.getFileDownloadUrl
                - text: .
              - listitem [ref=f3e289]:
                - text: Host-controlled modals with
                - code [ref=f3e290]: window.openai.requestModal
                - text: .
              - listitem [ref=f3e291]:
                - text: Widget-state persistence with
                - code [ref=f3e292]: window.openai.widgetState
                - text: and
                - code [ref=f3e293]: window.openai.setWidgetState
                - text: .
            - paragraph [ref=f3e294]: "Feature-detect each extension and provide a fallback when practical:"
            - generic [ref=f3e295]:
              - code [ref=f3e296]:
                - generic [ref=f3e297]: "const openai = typeof window !== \"undefined\" ? window.openai : undefined;"
                - generic [ref=f3e298]: "if (openai?.requestModal) {"

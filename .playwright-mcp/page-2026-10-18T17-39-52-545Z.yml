        - heading "Frequently Asked Questions About Grok Bot" [level=2] [ref=f37e297]
        - paragraph [ref=f37e298]: Everything you need to know about xAI's always-on AI teammates.
      - generic [ref=f37e299]:
        - generic [ref=f37e300]:
          - button "What is Grok Bot? expand_more" [ref=f37e301] [cursor=pointer]:
            - heading "What is Grok Bot?" [level=3] [ref=f37e302]
            - generic [ref=f37e303]: expand_more
          - paragraph [ref=f37e305]: Grok Bot is xAI's team of always-on AI agents, launched in early beta on August 11, 2026. Each Bot gets its own computer in the cloud, signs in to your existing tools, and completes multi-step work—sales outreach, research, onboarding, debugging—then comes back with the finished job. You message it like a colleague instead of building workflows.
        - generic [ref=f37e306]:
          - button "How do I get access to Grok Bot? expand_more" [ref=f37e307] [cursor=pointer]:
            - heading "How do I get access to Grok Bot?" [level=3] [ref=f37e308]
            - generic [ref=f37e309]: expand_more
          - paragraph [ref=f37e311]: There is no standalone Grok Bot subscription. Access is bundled with SuperGrok Heavy ($300/month), Cursor Ultra ($200/month), or Cursor Teams Premium ($120 per user/month). Open the Grok Bot app, sign in, and link the account that carries your plan. Enterprises can join a waitlist.
        - generic [ref=f37e312]:
          - button "What platforms does Grok Bot run on? expand_more" [ref=f37e313] [cursor=pointer]:
            - heading "What platforms does Grok Bot run on?" [level=3] [ref=f37e314]
            - generic [ref=f37e315]: expand_more
          - paragraph [ref=f37e317]: Grok Bot runs as a desktop app on macOS and Windows (with a Linux build also posted) and on iOS. Because every Bot works on its own computer in the cloud, jobs keep running even when your own devices are off.
        - generic [ref=f37e318]:
          - button "How is Grok Bot different from the Grok chatbot? expand_more" [ref=f37e319] [cursor=pointer]:
            - heading "How is Grok Bot different from the Grok chatbot?" [level=3] [ref=f37e320]
            - generic [ref=f37e321]: expand_more
          - paragraph [ref=f37e323]: Grok is a chatbot you talk to; Grok Bot is a set of agents that work for you. Bots hold persistent access to browsers, tools, inboxes, and files on their own cloud machine, run jobs end to end—even on platforms with no API or MCP support—and only check in when a human decision is needed.
        - generic [ref=f37e324]:
          - button "What model powers Grok Bot, and how is usage billed? expand_more" [ref=f37e325] [cursor=pointer]:
            - heading "What model powers Grok Bot, and how is usage billed?" [level=3] [ref=f37e326]
            - generic [ref=f37e327]: expand_more
          - paragraph [ref=f37e329]: Grok Bot runs on xAI's latest frontier models, including Grok 4.6 (released August 7, 2026). Subscriptions include weekly usage; eligible accounts can continue past the allowance with on-demand billing based on model and token costs, and there is no Bot-specific spend cap yet—so keep an eye on heavy jobs.
        - generic [ref=f37e330]:
          - button "Is Grok Bot safe to use with my accounts? expand_more" [ref=f37e331] [cursor=pointer]:
            - heading "Is Grok Bot safe to use with my accounts?" [level=3] [ref=f37e332]
            - generic [ref=f37e333]: expand_more
          - paragraph [ref=f37e335]: Bots work in isolated cloud environments and use secure credential storage—xAI's docs tell you never to paste API keys or passwords into chat. You can message a Bot anytime to steer or stop a job, and it returns for approval before decisions that need a human. It's still an early beta, so review its work before it ships.

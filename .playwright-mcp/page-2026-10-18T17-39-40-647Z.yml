          - paragraph [ref=f36e375]: Pick Grok Bot if you already pay for the top Cursor or SuperGrok tier and your bottleneck is "the work is stuck in five websites." Pick a coding agent if the work is the repo. Pick Claude Cowork if your stack is already Claude and you do not want a second $200 bill.
          - paragraph [ref=f36e376]: A student in Jakarta writing a thesis should not start here. A three-person agency in São Paulo that already burns Cursor Ultra on client sites might.
          - heading "Honest limits and security boundaries" [level=2] [ref=f36e377]
          - paragraph [ref=f36e378]: Early beta means the product will change under you. Official docs already carry a long security chapter. Ignore it and the shared computer becomes a single stolen-session problem.
          - paragraph [ref=f36e379]: "Hard limits worth repeating:"
          - list [ref=f36e380]:
            - listitem [ref=f36e381]:
              - strong [ref=f36e382]: One computer per account.
              - text: Separate Bots are not a firewall.
            - listitem [ref=f36e383]:
              - strong [ref=f36e384]: Approvals do not rewind history.
              - text: They only stop the next action.
            - listitem [ref=f36e385]:
              - strong [ref=f36e386]: Do not type passwords into chat.
              - text: Take over the VM.
            - listitem [ref=f36e387]:
              - strong [ref=f36e388]: Do not "Always allow" the entire browser.
              - text: Auto Review rules should be narrow. Require Approval wins if two rules clash.
            - listitem [ref=f36e389]:
              - strong [ref=f36e390]: Local-computer execution is optional and dangerous.
              - text: Default is ask every time. Prefer never.
            - listitem [ref=f36e391]:
              - strong [ref=f36e392]:
                - text: Deleting a Bot does not delete sessions or
                - code [ref=f36e393]: /workspace
                - text: files.
            - listitem [ref=f36e394]:
              - strong [ref=f36e395]: Legacy Privacy Mode is incompatible.
            - listitem [ref=f36e396]:
              - strong [ref=f36e397]: Linux desktop is out.
            - listitem [ref=f36e398]:
              - strong [ref=f36e399]: Enterprise is waitlisted.
            - listitem [ref=f36e400]:
              - strong [ref=f36e401]: The price is real.
              - text: $200–$300 a month is not a rounding error in most independent budgets.
          - paragraph [ref=f36e402]: "xAI's own suggested first tasks stay on the safe side of that list: summarize a file, inspect a dashboard, draft something for approval. A Bot that \"just handles finance\" on day one is a prompt, not a control system."
          - paragraph [ref=f36e403]: If you connect a company inbox, use a scoped mailbox, keep sends behind approval, and revoke the session when the project ends. If you cannot explain to a partner in Nairobi what the Bot is allowed to click, you are not ready to give it the click.
          - paragraph [ref=f36e404]: Grok Bot can be a genuine teammate for people already on the expensive Cursor or SuperGrok tracks. It is a poor substitute for a $20 chat plan, and it is a reckless place to store the only copy of a client's passwords.
          - heading "Frequently asked questions" [level=2] [ref=f36e405]
          - heading "What is Grok Bot and when did it launch?" [level=3] [ref=f36e406]
          - paragraph [ref=f36e407]:
            - text: Grok Bot is xAI's early-beta roster of named AI teammates. Each Bot works on a persistent cloud computer and can drive real apps, including tools with no clean API. xAI launched it on
            - strong [ref=f36e408]: 11 August 2026
            - text: . It is a product surface, not a new Grok model release.
          - complementary "إعلان" [ref=f36e409]:
            - generic [ref=f36e410]: إعلان ممول
          - heading "Which subscriptions include Grok Bot?" [level=3] [ref=f36e413]
          - paragraph [ref=f36e414]:
            - text: Official access is
            - strong [ref=f36e415]: SuperGrok Heavy
            - text: ($300 per month),
            - strong [ref=f36e416]: Cursor Ultra
            - text: ($200 per month), and
            - strong [ref=f36e417]: Cursor Premium Teams
            - text: ($120 per seat per month). Enterprise buyers join a waitlist and contact sales. There is no public cheap add-on that unlocks Grok Bot by itself.
          - heading "How is Grok Bot different from a coding agent?" [level=3] [ref=f36e418]
          - paragraph [ref=f36e419]: A typical coding agent lives in a repo and a session. Grok Bot has a long-lived VM, browser, and terminal, and finishes work in the real app. Several named Bots can run in parallel and pass work in a group chat. Use a coding agent for the repo. Use Grok Bot for multi-app jobs.
          - heading "Do Grok Bots share one computer?" [level=3] [ref=f36e420]
          - paragraph [ref=f36e421]: "Yes. Official docs are explicit: every Bot on your account shares one cloud computer. Files, browser logins, and credentials are account-scoped, not Bot-scoped. Each Bot has its own screen so they can work in parallel. Do not treat a second Bot as a security boundary."
          - heading "Can Grok Bot use apps that have no API?" [level=3] [ref=f36e422]
          - paragraph [ref=f36e423]: Yes. That is a launch claim and a docs claim. Where connectors or MCP exist, the Bot can use them. Where they do not, it uses computer-use and works through the interface. You still need to sign in, and you should take over the VM for passwords and two-factor codes.
          - heading "Is Grok Bot available on Windows and iOS?" [level=3] [ref=f36e424]
          - paragraph [ref=f36e425]: iOS is part of the 11 August launch surfaces. The launch post published a macOS 0.18.0 disk image. Official get-started docs now also document Windows x64 and Arm64 installers. There is no Linux desktop app. Use the vendor's current download page rather than an unofficial mirror.
          - heading "Is Grok Bot the same as Grok 4.6?" [level=3] [ref=f36e426]
          - paragraph [ref=f36e427]: No. Grok 4.6 is a model. Grok Bot is an agent product that gives named teammates a shared cloud computer. You can read our Grok 4.6 explainer separately. Buying or using one does not automatically mean you have the other.
          - heading "Should I connect company email on day one?" [level=3] [ref=f36e428]
          - paragraph [ref=f36e429]: No. Start with a local document or a read-only dashboard. Official security guidance says to keep sending, publishing, purchases, deletion, and production changes behind approval. All Bots share sessions, so a mailbox login is a roster-wide login. Use a scoped account if you connect mail at all.

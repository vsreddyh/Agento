                - /url: https://x.ai/news/introducing-grok-bot
          - heading "What Grok Bot is — and what it is not" [level=2] [ref=f36e111]
          - paragraph [ref=f36e112]:
            - text: Official docs define a Bot as a
            - strong [ref=f36e113]: single persistent, named agent
            - text: . It has memory, files, browser sessions, and preferences that survive across turns. It runs on a cloud VM with a
            - strong [ref=f36e114]: browser
            - text: ", a"
            - strong [ref=f36e115]: filesystem
            - text: ", and a"
            - strong [ref=f36e116]: terminal
            - text: . It can use connectors or MCP where those exist. Where an app has
            - strong [ref=f36e117]: no clean API
            - text: ", it uses computer-use and works in the interface like a person."
          - paragraph [ref=f36e118]: That last point is the product. A coding agent that stays inside an editor is useful. A teammate that can open Zendesk, a CRM, Gmail, and a buggy UI is a different job. xAI's launch post says Bots "finish jobs end to end, and only come back when something needs your approval."
          - paragraph [ref=f36e119]: "What Grok Bot is not:"
          - list [ref=f36e120]:
            - listitem [ref=f36e121]:
              - text: It is
              - strong [ref=f36e122]: not
              - text: Grok 4.6.
            - listitem [ref=f36e123]:
              - text: It is
              - strong [ref=f36e124]: not
              - text: a free consumer chatbot.
            - listitem [ref=f36e125]:
              - text: It is
              - strong [ref=f36e126]: not
              - text: a Linux desktop app today.
            - listitem [ref=f36e127]:
              - text: It is
              - strong [ref=f36e128]: not
              - text: generally available to every Grok user.
            - listitem [ref=f36e129]:
              - text: It is
              - strong [ref=f36e130]: not
              - text: a promise that every company inbox is safe to connect on day one.
          - paragraph [ref=f36e131]: xAI built it as an internal prototype. Sales, operations, and engineering teams inside the company used it before the 11 August public beta. The public story is that same prototype, opened to three paid gates.
          - heading "Who can use it, and what the official plans cost" [level=2] [ref=f36e132]

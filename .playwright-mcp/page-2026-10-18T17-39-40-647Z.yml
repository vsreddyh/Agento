          - paragraph [ref=f36e204]:
            - text: Those are
            - strong [ref=f36e205]: USD
            - text: list prices on the official page. There is no cheaper "Grok Bot Lite" on the same page. If you are not already on one of those plans, the honest first decision is whether a cloud teammate is worth
            - strong [ref=f36e206]: $200–$300 per month
            - text: (or
            - strong [ref=f36e207]: $120 per seat
            - text: on the team SKU). For many students and freelancers in Nairobi or Jakarta, it is not.
          - paragraph [ref=f36e208]:
            - text: "The 11 August launch post published a specific macOS build:"
            - link "Grok Bot 0.18.0 for Apple silicon" [ref=f36e209] [cursor=pointer]:
              - /url: https://downloads.cursor.com/grokbot/stable/darwin-arm64/0.18.0/Grok_Bot_0.18.0.dmg
            - text: . Official get-started docs now also describe
            - strong [ref=f36e210]: Windows
            - text: x64 and Arm64 installers, plus iOS. There is
            - strong [ref=f36e211]: no Linux desktop app
            - text: . Downloads live on Cursor's domain. That is not a coincidence. Authentication, privacy settings, and account deletion follow
            - strong [ref=f36e212]: Cursor
            - text: ", not a separate xAI consumer login."
          - paragraph [ref=f36e213]:
            - text: Grok Bot
            - strong [ref=f36e214]: requires cloud data storage
            - text: . Accounts on Cursor
            - strong [ref=f36e215]: Legacy Privacy Mode
            - text: must change that setting before the product will start. That is a hard blocker, not a footnote.
          - 'heading "First handoff: numbered setup and first task" [level=2] [ref=f36e216]'
          - paragraph [ref=f36e217]: Do the first handoff on a task that cannot empty a bank account. Official docs suggest a document summary or a read-only dashboard look. Save CRM writes and outbound mail for later.
          - list [ref=f36e218]:
            - listitem [ref=f36e219]:
              - paragraph [ref=f36e220]:
                - strong [ref=f36e221]: Confirm the plan.
                - text: Sign in with the Cursor account that holds SuperGrok Heavy, Cursor Ultra, or Cursor Premium Teams. If you only have a cheap chat subscription, stop here. Grok Bot will not appear as a hidden free flag.
            - listitem [ref=f36e222]:
              - paragraph [ref=f36e223]:
                - strong [ref=f36e224]: Install the desktop app.
                - text: On macOS, pick Apple silicon or Intel, open the disk image, and drag Grok Bot into Applications. On Windows, run the x64 or Arm64 installer. On a phone, use the iOS app. Check
                - strong [ref=f36e225]: Apple menu → About This Mac
                - text: (Chip vs Processor) or
                - strong [ref=f36e226]: Settings → System → About → System type
                - text: so you do not download the wrong binary.
            - listitem [ref=f36e227]:
              - paragraph [ref=f36e228]:
                - strong [ref=f36e229]: Sign in with Cursor.
                - text: Choose
                - strong [ref=f36e230]: Get started
                - text: ", finish browser authentication, and return to the app. SSO users complete the normal organisation flow. First-run screens ask which tools you use. Those answers only shape suggestions. They do not connect the tools yet."
            - listitem [ref=f36e231]:
              - paragraph [ref=f36e232]:
                - strong [ref=f36e233]: Create one narrow Bot.
                - text: "Give it a short name, one primary job, and a written boundary. Example: \"Piper / product performance / investigate with observability tools, keep screenshots, never change production.\" A catch-all Bot learns slower and is harder to audit."
            - listitem [ref=f36e234]:
              - paragraph [ref=f36e235]:
                - strong [ref=f36e236]: Hand off a closed-loop first task.
                - text: "Official docs use a request with five parts: outcome, sources, constraints, deliverable, review point. A safe first prompt is: \"Summarize this document in five bullets. List every date, decision, and open question. Cite the section. Do not change the source file.\""
            - listitem [ref=f36e237]:
              - paragraph [ref=f36e238]:
                - strong [ref=f36e239]: Escalate to one real tool, still read-only.
                - text: "\"Open the analytics dashboard, compare this week's new-user activation with the previous four weeks, and draft an investigation plan with chart links. Do not change any dashboard. Ask me to sign in if needed.\""
            - listitem [ref=f36e240]:
              - paragraph [ref=f36e241]:
                - strong [ref=f36e242]: Take over for passwords yourself.
                - text: When the Bot hits a login, open
                - strong [ref=f36e243]: Agent Computer
                - text: ", take control, enter the password, passkey, two-factor code, or CAPTCHA, then return control. Do not paste secrets into ordinary chat."
          - complementary "إعلان" [ref=f36e244]:
            - generic [ref=f36e245]: إعلان ممول
          - list [ref=f36e248]:
            - listitem [ref=f36e249]:
              - paragraph [ref=f36e250]:
                - strong [ref=f36e251]: Correct the format once, out loud.
                - text: "\"Use this format for future weekly reports: five bullets, source links inline, and a final section called Decisions needed.\" That sentence is how memory becomes a house style."
            - listitem [ref=f36e252]:
              - paragraph [ref=f36e253]:
                - strong [ref=f36e254]: Save a routine only after the path is stable.
                - text: Ask the Bot to follow along the next time you do the job live, then persist it as a skill or scheduled routine. Do not automate a workflow you have not watched.
            - listitem [ref=f36e255]:
              - paragraph [ref=f36e256]:
                - strong [ref=f36e257]: Keep sending, paying, deleting, and production changes behind approval.
                - text: Official security docs list those actions as the ones that should stop. An approval does not undo work already done.
          - paragraph [ref=f36e258]: That is a complete first week. If you skip to "sign into the company CRM and clear the pipeline," you have not followed the vendor's own onboarding. You have just given a shared VM your production session.
          - heading "How the shared cloud computer actually works" [level=2] [ref=f36e259]
          - paragraph [ref=f36e260]:
            - text: All of your Bots use
            - strong [ref=f36e261]: one
            - text: persistent cloud computer. It is isolated to
            - strong [ref=f36e262]: your account
            - text: ", not to each Bot. Files, browser sessions, and command-line credentials on that machine are visible to the whole roster. Each Bot gets its"
            - strong [ref=f36e263]: own screen
            - text: ", so they can drive the browser in parallel. They do"
            - strong [ref=f36e264]: not
            - text: get separate security sandboxes.
          - paragraph [ref=f36e265]: Read that twice before you connect Gmail.
          - paragraph [ref=f36e266]: Handoffs become easy because of this design. A research Bot can leave a folder that a writing Bot already sees. A sales Bot can use the CRM session you signed into for an ops Bot. The same design is why "I made a second Bot so the first one cannot see payroll" is false.
          - paragraph [ref=f36e267]:
            - text: Bots can message each other, share threads, and sit in a
            - strong [ref=f36e268]: group chat
            - text: ". xAI's internal pattern is a chief-of-staff Bot on top of specialists: inbox, expenses, recruiting, bugs. You are not supposed to be the paste-bridge between chats."
          - paragraph [ref=f36e269]:
            - text: The computer keeps working if your laptop lid is closed. That is the official 24/7 claim. Local execution on the Mac or Windows machine in front of you is a
            - strong [ref=f36e270]: separate
            - text: setting (
            - strong [ref=f36e271]: Settings → General → Agent → Execution on Local Computer
            - text: ), defaulting to
            - strong [ref=f36e272]: Ask every time
            - text: . Use
            - strong [ref=f36e273]: Never allowed
            - text: unless a Bot has a specific reason to touch local files. Turning local execution off does not stop the cloud VM.
          - figure "Official Grok Bot product-page launch trailer poster" [ref=f36e274]:
            - img "Official Grok Bot product-page launch trailer poster" [ref=f36e275]
          - paragraph [ref=f36e277]:
            - emphasis [ref=f36e278]:
              - text: "Source:"
              - link "Grok Bot product page" [ref=f36e279] [cursor=pointer]:
                - /url: https://x.ai/bot
          - heading "Teaching a Bot by watching once" [level=2] [ref=f36e280]
          - paragraph [ref=f36e281]: xAI's favourite demo is not a prompt library. It is a live demonstration. You ask the Bot to follow along while you do the job once. It stores the path as a routine, accepts corrections, and can run it later on a schedule.
          - paragraph [ref=f36e282]: That is closer to training a junior hire than to writing a Zapier graph. It is also how mistakes get cloned. If you show a sloppy CRM update, you have just taught sloppy CRM updates.
          - paragraph [ref=f36e283]: Official get-started advice is to name lasting preferences explicitly. "Always keep evidence above hypotheses." "Never email a customer without a draft for me." "Cite the dashboard link." Those sentences are cheaper than a second $200 seat.
          - paragraph [ref=f36e284]:
            - text: When the routine exists, review it the way you would review a junior's checklist. Pause it when the source system changes. Deleting a Bot does
            - strong [ref=f36e285]: not
            - text: wipe the shared computer. You still have to sign out of sites, remove files from
            - code [ref=f36e286]: /workspace
            - text: ", uninstall connectors, and revoke tokens in the source app."
          - complementary "إعلان" [ref=f36e287]:
            - generic [ref=f36e288]: إعلان ممول
          - heading "How xAI's own teams use Grok Bot" [level=2] [ref=f36e291]
          - paragraph [ref=f36e292]: The launch post is unusually concrete about internal use. Treat these as existence proofs, not as a claim that your five-person agency will match them on day two.
          - paragraph [ref=f36e293]:
            - strong [ref=f36e294]: Sales.
            - text: A Bot updates the CRM from call transcripts and drafts follow-ups. Another researches accounts overnight, scores contacts, and leaves email and LinkedIn drafts in the seller's voice. A pipeline Bot flags stalls and drops a Monday scoreboard.
          - paragraph [ref=f36e295]:
            - strong [ref=f36e296]: Operations.
            - text: A Bot seats new hires and processes invoices that arrive in Gmail. Expense and recruiting specialists show up in the same "many Bots at once" pattern.
          - paragraph [ref=f36e297]:
            - strong [ref=f36e298]: Engineering.
            - text: A Bot reproduces a bug in the product UI, files the ticket, and hands the fix to a debugging Bot. That is computer-use, not an API wrapper.
          - paragraph [ref=f36e299]:
            - strong [ref=f36e300]: Product and community quotes
            - text: "on the launch page push the same idea: most assistants stop at 90 percent; Grok Bot is supposed to put the work in the actual tool. Those are vendor quotes. Your first weekend will feel more like onboarding than like eight extra arms."
          - paragraph [ref=f36e301]: A two-person studio in São Paulo that already lives in Cursor Ultra can copy the sales-draft pattern without copying SpaceXAI's org chart. A campus club in Manila probably cannot justify $200 a month to file imaginary invoices.
          - heading "Access, pricing, and detection for students and professionals" [level=2] [ref=f36e302]
          - paragraph [ref=f36e303]:
            - strong [ref=f36e304]: Access.
            - text: If you can pay for SuperGrok Heavy, Cursor Ultra, or Cursor Premium Teams, and you have macOS, Windows, or iPhone, you can start. If you cannot, you watch from the waitlist or you use a cheaper agent. Availability is plan-gated, not city-gated. A founder in Lagos with Cursor Ultra is in. A founder in the same city on a free Grok session is out.
          - paragraph [ref=f36e305]:
            - text: Enterprise is explicitly
            - strong [ref=f36e306]: not
            - text: self-serve on day one. Contact sales and wait.
          - paragraph [ref=f36e307]:
            - strong [ref=f36e308]: Pricing.
            - text: "The official page is blunt:"
            - strong [ref=f36e309]: $200
            - text: ","
            - strong [ref=f36e310]: $300
            - text: ", or"
            - strong [ref=f36e311]: $120 per seat
            - text: . There is no published "Grok Bot-only" micro-plan. Token "extended limits" are bundled into Ultra. Heavy sells speed and ceiling. Teams sells admin. None of those numbers is a Truescho shop SKU. We do
            - strong [ref=f36e312]: not
            - text: sell Grok Bot. Shared ChatGPT and Claude plans in the
            - link "Truescho shop" [ref=f36e313] [cursor=pointer]:
              - /url: https://truescho.com/en/shop
            - text: are a different product for people who need a model, not a cloud VM.
          - paragraph [ref=f36e314]:
            - strong [ref=f36e315]: Detection.
            - text: Grok Bot is not a watermark product. The detection question here is organisational, not forensic. Other people will see the Bot's work
            - strong [ref=f36e316]: inside the tools it logged into
            - text: ": the CRM note, the GitHub ticket, the Gmail draft, the browser history on the shared VM. If a Bot posts under your session, the platform will attribute that action to the signed-in account. There is no \"the Bot did it\" stamp that protects you."
          - paragraph [ref=f36e317]: xAI and Cursor also collect what the product needs to function. Legacy Privacy Mode is incompatible. Training opt-out follows Cursor account settings. Read the current Cursor privacy and security pages before you connect a customer list.
          - paragraph [ref=f36e318]:
            - text: If you mainly need a chat model rather than a $200-a-month cloud teammate, compare current writing and coding tools in the
            - link "Truescho AI tools directory" [ref=f36e319] [cursor=pointer]:
              - /url: https://truescho.com/en/tools/ai
            - text: .
          - heading "Grok Bot vs Claude Cowork vs a normal coding agent" [level=2] [ref=f36e320]
          - paragraph [ref=f36e321]: The useful comparison is not "which model is smarter?" It is "where does the work live when you walk away?"
          - complementary "إعلان" [ref=f36e322]:
            - generic [ref=f36e323]: إعلان ممول

              - text: — shared-computer rules
          - heading "What to do next" [level=2] [ref=f36e442]
          - paragraph [ref=f36e443]: If you already pay for Cursor Ultra or SuperGrok Heavy, install the official app, create one narrow Bot, and run the read-only first task above. If you do not, skip the waitlist theatre and use a cheaper model until the work you need actually requires a cloud computer. Grok Bot is four days past launch as of this guide, still an early beta, and priced like a specialist seat — which is exactly how it should be treated.

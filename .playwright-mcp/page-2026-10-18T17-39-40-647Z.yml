          - paragraph [ref=f36e95]:
            - text: xAI launched
            - strong [ref=f36e96]: Grok Bot
            - text: "on"
            - strong [ref=f36e97]: 11 August 2026
            - text: "as an early beta: named AI teammates that share one persistent cloud computer and keep working after you close the laptop. This is a setup guide for the first handoff — from an eligible plan to a finished draft you can approve — not a same-day breaking alert."
          - paragraph [ref=f36e98]:
            - strong [ref=f36e99]: Grok Bot xAI
            - text: is a product, not a new model. Early beta access sits on
            - strong [ref=f36e100]: SuperGrok Heavy at $300 per month
            - text: ","
            - strong [ref=f36e101]: Cursor Ultra at $200 per month
            - text: ", and"
            - strong [ref=f36e102]: Cursor Premium Teams at $120 per seat per month
            - text: ", plus an enterprise waitlist. Desktop and iOS are live. You message a Bot like a colleague. You do not build a workflow canvas first."
          - paragraph [ref=f36e103]:
            - text: If you came here because you already use
            - link "Grok 4.6" [ref=f36e104] [cursor=pointer]:
              - /url: /en/blog/grok-46-xai-ai-model
            - text: ", park that article. Grok 4.6 is a model. Grok Bot is a roster of agents with a virtual machine. Mixing the two names is the most common mistake in the first week after launch."
          - figure "Official Grok Bot launch artwork from xAI" [ref=f36e105]:
            - img "Official Grok Bot launch artwork from xAI" [ref=f36e106]
          - paragraph [ref=f36e108]:
            - emphasis [ref=f36e109]:

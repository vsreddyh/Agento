# Single entrypoint for the Agento Android app: health sync only.
# Mounted read-only at /etc/nginx/conf.d/ (included inside the image's http{}
# block).
#
# Routes are path-disjoint by design:
#   /api/*   → health-api (tasks, projects, files, health sync, reports, …)
#   /health  → health-api (liveness probe, no auth)
#   /ping    → this proxy (container healthcheck, static)
# Direct health-api stays published for comparison: :8001 — compose default;
# HEALTH_HOST_PORT remaps the host side.

# Forwarding headers (X-Real-IP / X-Forwarded-For / X-Forwarded-Proto) are repeated in
# every proxying location rather than set once at server level, because nginx does NOT
# merge them: a location that declares any `proxy_set_header` inherits none of the
# parent level's, so a server-level block would be silently dropped by every location
# here, each of which sets `Host`. Measured, not assumed — with them at server level
# the upstream received `X-Forwarded-For` only when the client had sent one, and never
# `X-Forwarded-Proto` or `X-Real-IP`.

# NOTE: no upstream{} blocks — proxy_pass uses the $sync variable so nginx
# re-resolves DNS per request (see resolver in server block).

server {
    listen 80 default_server;

    # Re-resolve upstreams on every request: container IPs change across
    # recreates and nginx otherwise caches the first DNS answer forever
    # (stale-IP 502s after `up -d`). 10.89.0.1 is the aardvark embedded-DNS
    # address of the compose network, and it is HARDCODED, so it has to be
    # re-derived whenever that network is recreated with a different subnet:
    #
    #   podman network inspect docker_default \
    #     --format '{{range .Subnets}}{{.Gateway}} {{.Subnet}}{{end}}'
    #
    # Currently 10.89.0.1 on 10.89.0.0/24, verified against the live network. A
    # subnet change does not fail loudly here — nginx still starts, and the symptom
    # is stale-IP 502s after a `up -d`, which reads as an upstream bug rather than a
    # resolver one. Podman's own embedded DNS answers on 127.0.0.11 inside a
    # container, but pinning that instead would break the moment this conf is read
    # outside one.
    resolver 10.89.0.1 valid=10s;
    set $sync http://health-api:8000;

    # Fail fast when the upstream is gone rather than hanging: the 60s default
    # means a request arriving during a health-api restart waits a minute for a
    # connection that was never going to be made, and the app sees a stalled
    # request instead of a 502 it can retry. Set once here, so every location
    # gets it — the upstream is on the compose network, where a connect is
    # either immediate or refused.
    proxy_connect_timeout 5s;

    location /api/ {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Matches the service cap: 25 MiB files + 1 MiB multipart framing
        # slack (see maxUploadBytes in cmd/health-api/files.go). Lower
        # answers a legitimate upload with a bare 413 instead of the
        # service's named file_too_large error.
        client_max_body_size 26m;
    }

    location = /health {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare /api (no trailing slash): the /api/ prefix location above does
    # not match it, so without this exact it 404s html at nginx while
    # direct :8001/api answers the service JSON fallback — one envelope
    # per path, proxy and direct alike.
    location = /api {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trailing-slash alias: health-api serves both spellings, so the proxy
    # must too — otherwise /health/ 404s at nginx while /health/ direct
    # serves, two different 404s for one probe path.
    location = /health/ {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        access_log off;
        return 200 "ok\n";
    }
}

# Single entrypoint for the Agento Android app: ONE URL serves both the chat
# backend (gateway :8642, Hermes built-in OpenAI-compatible API server) and
# health sync (health-api :8000). Mounted read-only at
# /etc/nginx/conf.d/ (included inside the image's http{} block).
# Routes are path-disjoint by design:
#   /p/*     → gateway    (chat completions + models, per-profile paths;
#                           incl. /p/<profile>/api/model/options picker)
#   /api/model/options (unprefixed) → gateway (provider picker inventory)
#   /api/*   → health-api (POST /api/health/sync)
#   /health  → health-api (liveness probe, no auth)
#   /ping    → this proxy (container healthcheck, static)
# Direct ports (:8642, :8001) stay published for backward compatibility.

# NOTE: no upstream{} blocks — proxy_pass uses $chat/$sync variables so
# nginx re-resolves DNS per request (see resolver in server block).

server {
    listen 80 default_server;

    # Re-resolve upstreams on every request: container IPs change across
    # recreates and nginx otherwise caches the first DNS answer forever
    # (stale-IP 502s after `up -d gateway`). 10.89.0.1 is the compose
    # network's aardvark DNS (see docker_default subnet in compose).
    resolver 10.89.0.1 valid=10s;
    set $chat http://gateway:8642;
    set $sync http://health-api:8000;

    # SSE streaming (chat completions): never buffer, never time out mid-stream.
    location /p/ {
        proxy_pass $chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Exact gateway picker path (unprefixed) goes to chat, not sync —
    # the app builds its provider/model dropdowns from it. Both spellings:
    # a trailing slash would otherwise fall into /api/ below and 404.
    location = /api/model/options {
        proxy_pass $chat;
        proxy_set_header Host $host;
    }
    location = /api/model/options/ {
        proxy_pass $chat;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 5m;
    }

    location = /health {
        proxy_pass $sync;
        proxy_set_header Host $host;
    }

    location = /ping {
        access_log off;
        return 200 "ok\n";
    }
}

# Single entrypoint for the Agento Android app: ONE URL serves both the chat
# backend (pi :8643, the pi-gateway OpenAI-compatible surface) and health sync
# (health-api :8000). Mounted read-only at /etc/nginx/conf.d/ (included inside the
# image's http{} block).
# Routes are path-disjoint by design:
#   /p/*     → pi         (chat completions + models, per-profile paths;
#                           incl. /p/<profile>/api/model/options picker)
#   /api/model/options (unprefixed) → pi (provider picker inventory)
#   /api/*   → health-api (POST /api/health/sync)
#   /health  → health-api (liveness probe, no auth)
#   /ping    → this proxy (container healthcheck, static)
# Direct ports stay published for comparison: :8643 (pi), :8001 (health-api).

# Forwarding headers (X-Real-IP / X-Forwarded-For / X-Forwarded-Proto) are repeated in
# every proxying location rather than set once at server level, because nginx does NOT
# merge them: a location that declares any `proxy_set_header` inherits none of the
# parent level's, so a server-level block would be silently dropped by all four
# locations here, each of which sets `Host`. Measured, not assumed — with them at
# server level the upstream received `X-Forwarded-For` only when the client had sent
# one, and never `X-Forwarded-Proto` or `X-Real-IP`.

# NOTE: no upstream{} blocks — proxy_pass uses $chat/$sync variables so
# nginx re-resolves DNS per request (see resolver in server block).

# The chat timeouts below are the OUTERMOST layer of a four-layer chain, and each
# layer is strictly above the one inside it. Read from the inside out:
#
#   900s  spawn_subagent delegation ceiling   (MAX_TIMEOUT_MS, pi/extensions/subagent.ts)
#  + 30s  its teardown                       (TEARDOWN_TIMEOUT_MS, same file)
#  + 30s  backend margin -> PI_TURN_TIMEOUT=960s  (cmd/pi-gateway)
#  + 30s  proxy margin -> proxy_read_timeout=990s  (here)
#
# Get the order wrong in either direction and a long turn dies somewhere useless:
# a proxy shorter than the backend answers 504 with no partial output, and a
# backend shorter than the delegation ceiling cuts a turn the agent was entitled
# to finish. These are IDLE timeouts between bytes, not total-turn limits — the
# backend also writes an SSE keepalive comment every 20s (PI_KEEPALIVE) — but the
# chain has to line up regardless, so that the layer that fires is always the
# innermost one that has an answer.

server {
    listen 80 default_server;

    # Re-resolve upstreams on every request: container IPs change across
    # recreates and nginx otherwise caches the first DNS answer forever
    # (stale-IP 502s after `up -d`). 10.89.0.1 is the aardvark embedded-DNS
    # address of the compose network, and it is HARDCODED, so it has to be
    # re-derived whenever that network is recreated with a different subnet:
    #
    #   podman network inspect docker_default \
    #     --format '{{range .Subnets}}{{.Gateway}} {{.Subnet}}{{end}}'
    #
    # Currently 10.89.0.1 on 10.89.0.0/24, verified against the live network. A
    # subnet change does not fail loudly here — nginx still starts, and the symptom
    # is stale-IP 502s after a `up -d`, which reads as a pi bug rather than a
    # resolver one. Podman's own embedded DNS answers on 127.0.0.11 inside a
    # container, but pinning that instead would break the moment this conf is read
    # outside one.
    resolver 10.89.0.1 valid=10s;
    set $chat http://pi:8643;
    set $sync http://health-api:8000;

    # Fail fast when an upstream is gone rather than hanging: the 60s default means
    # a request arriving during a `pi` restart waits a minute for a connection that
    # was never going to be made, and the app sees a stalled turn instead of a 502
    # it can retry. Set once here, so every location gets it — the two upstreams are
    # both on the compose network, where a connect is either immediate or refused.
    proxy_connect_timeout 5s;

    # SSE streaming (chat completions): never buffer, never time out mid-stream.
    location /p/ {
        # The /p prefix is the app's per-tab profile path, and pi-gateway expects
        # the profile as its FIRST segment: /god/v1/chat/completions. This rewrite is
        # load-bearing, not tidying — `proxy_pass $chat` uses a variable, which means
        # no URI part, which means nginx forwards the request URI unchanged. Verified
        # against nginx 1.27 with echo upstreams: with the rewrite
        # `/p/god/v1/chat/completions` arrives as `/god/v1/chat/completions`, and
        # without it as `/p/god/v1/chat/completions` — which pi-gateway reads as
        # profile "p" and 404s. `break` (not `last`) so the rewritten URI is what
        # this location proxies.
        rewrite ^/p(/.*)$ $1 break;
        proxy_pass $chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Outermost layer of the chain documented at the top of this file. It is
        # not what bounds a turn — PI_TURN_TIMEOUT (960s) is, and the delegation
        # ceiling under that (900s + 30s teardown) is the real reason a turn may
        # legitimately run this long. This value only decides who answers when
        # something upstream stops sending: 990s > 960s so the backend's own
        # structured timeout error wins, and the app gets a JSON body naming the
        # turn rather than a bare 504 from nginx.
        proxy_read_timeout 990s;
        # 60s, NOT 990s, and the asymmetry is the point: this governs writing the
        # REQUEST to pi, which is a small JSON POST that crosses the compose network.
        # Only the response is long. Matching it to the read timeout would let a
        # stalled client hold a backend slot — and a profile lock, since the whole
        # turn holds it — for as long as the delegation ceiling allows.
        proxy_send_timeout 60s;
        # 5m, NOT the 1m default and NOT 20m. The 1m default is wrong silently: it
        # answers a bare bodyless 413 to a chat turn carrying a base64 image or a
        # large tool payload. But the authority on this limit is the backend —
        # maxBodyBytes in internal/gateway/body.go, 4 MiB — and this is deliberately
        # a little ABOVE it rather than equal to it, for the same reason the timeout
        # chain is ordered rather than matched: the layer that fires should be the
        # innermost one that has an answer. pi-gateway's 413 names the limit and
        # tells the client to shrink the request; nginx's is a bare 413 with no body.
        # Equal limits would hand every oversized request to the one that says least.
        # `/api/` below keeps its own 5m for health payloads.
        client_max_body_size 5m;
    }

    # The picker path (unprefixed) goes to chat, not sync — the app builds its
    # provider/model dropdowns from it. Both spellings are matched, because a
    # trailing slash would otherwise fall into /api/ below and 404 in health-api.
    # No rewrite here: pi-gateway serves /api/model/options unprefixed, with "api"
    # a reserved first segment rather than a profile name.
    location ~ ^/api/model/options/?$ {
        proxy_pass $chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Explicit rather than left at nginx's 60s default, and deliberately ABOVE
        # the backend's own budget: PI_INVENTORY_TIMEOUT is 30s, so at 40s the
        # backend's 502 (which names the failure) arrives before nginx's 504 (which
        # does not). A proxy timeout shorter than the backend's is how a real error
        # gets reported as an unexplained gateway timeout.
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }

    location /api/ {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 5m;
    }

    location = /health {
        proxy_pass $sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        access_log off;
        return 200 "ok\n";
    }
}

# ──────────────────────────────────────────────────────
# Shared service definition (env + build context for the bot image).
# ──────────────────────────────────────────────────────
x-bot-base: &bot-base
  build:
    context: ..
    dockerfile: test/Dockerfile
  user: "1000:1000"
  environment: &bot-base-environment
    HERMES_HOME: /opt/data
    HOME: /opt/data
    # Official image refuses root gateways unless explicitly allowed
    # (we run root so bind-mounted state stays host-owned; same as before).
    HERMES_ALLOW_ROOT_GATEWAY: 1
    OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    # hermes-agent resolves provider credentials ONLY from these two names
    # (plugins/model-providers/opencode-zen: env_vars per provider) — same
    # single key value under both names.
    OPENCODE_ZEN_API_KEY: ${OPENCODE_API_KEY:-}
    OPENCODE_GO_API_KEY: ${OPENCODE_API_KEY:-}
    HERMES_API_KEY: ${OPENCODE_API_KEY:-}
    MONGODB_URI: ${MONGODB_URI:-}
    MONGODB_DB: ${MONGODB_DB:-hermes}
  restart: unless-stopped

services:

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # MONGODB_URI/PASSWORD from root .env.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ..
      dockerfile: docker/health-api/Dockerfile
    user: "1000:1000"
    ports:
      - "8001:8000"
    volumes:
      # VPS exports folder for mobile downloads (#26); read-only is enough.
      - ../exports:/exports:ro
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      PASSWORD: ${PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Multiplexed gateway — ONE container serves god (default profile =
  # gateway home) + story/resumes sides, with money/cookbook/health-check
  # MCPs on god, plus the built-in OpenAI-compatible API server (:8642)
  # for the custom Android app. HERMES_HOME (gateway/) IS god; story/resumes
  # are nested under gateway/profiles/. The entrypoint renders each
  # profile's config from these env vars.
  #
  # ALL env comes from the single root .env (compose interpolation).
  # ──────────────────────────────────────────────────────
  gateway:
    <<: *bot-base
    # Starts as root so bind-mounted state stays host-owned (their s6 tree is bypassed).
    user: "0:0"
    ports:
      - "${API_SERVER_PORT:-8642}:8642"
    volumes:
      - ../gateway:/opt/data
      - ../workspace:/workspace
      # VPS SSH keys, least-privilege file mounts (read-only): side profiles
      # push/pull their repos (resumes, portals) as the VPS GitHub identity.
      # Only the keypair + known_hosts are visible — never authorized_keys or
      # other keys. Missing sources fail container creation (fail fast);
      # override the source dir via VPS_SSH_DIR in the root .env when the
      # VPS user isn't root.
      - ${VPS_SSH_DIR:-/root/.ssh}/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${VPS_SSH_DIR:-/root/.ssh}/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - ${VPS_SSH_DIR:-/root/.ssh}/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      <<: *bot-base-environment
      PASSWORD: ${PASSWORD:-}
      # Fail-closed SSH for agent-run git: only the mounted key is ever
      # offered, never prompt, never trust unknown hosts (a GitHub key
      # rotation fails loudly until known_hosts is updated on the VPS).
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"

  # ──────────────────────────────────────────────────────
  # Proxy — single URL for the Agento app (chat + sync on one port).
  # Routes /p/* → pi :8643 and /api/* + /health → health-api :8000
  # (see docker/proxy/nginx.conf). App Server URL: http://<host>:${APP_PORT:-8080}.
  # Direct ports (:8643, :8001) stay published for backward compatibility.
  # ──────────────────────────────────────────────────────
  proxy:
    image: docker.io/nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Replaces the image's default server block (same server_name would
      # otherwise shadow ours for Host: localhost).
      - ../docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Short list form, and it has to be: `condition: service_started` is what a
      # Compose implementation would want here, but podman-compose builds its
      # dependency graph with `deps = {x: {} for x in deps}` and a mapping value is
      # an unhashable dict, so ANY `condition:` form — list or mapping syntax —
      # makes it die with `TypeError: cannot use 'dict' as a dict key` before it
      # reads a single service. Verified, both spellings. So the ordering is all we
      # get, and ordering is all this needs: nginx re-resolves `pi` per request
      # (`resolver 10.89.0.1 valid=10s`), so a proxy that starts before pi answers
      # 502 for a few seconds rather than never.
      #
      # Not waiting on pi's *health* is also the right behaviour independently: that
      # healthcheck is a real connectivity gate (its entrypoint refuses to start if
      # any of the five MCP servers will not connect), so a proxy gated on it would
      # take health-api's /api/* routes down with it — and health sync has nothing
      # to do with the agent.
      - pi
      - health-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Pi — the agent host. One container, one Pi process per profile (god, story,
  # resumes), fronted by the pi-gateway binary which serves the OpenAI-compatible
  # surface the Android app already speaks.
  #
  # Listens on 8643, NOT 8642, and that is deliberate: the `gateway` service above
  # still owns 8642 until the Hermes removal PR, so the two coexist and each app
  # tab can be pointed at one or the other to compare before anything is switched.
  # nginx keeps proxying /p/* to :8642 until then; switching it is one-line and is
  # part of the removal PR, not this one.
  #
  # This service merges *bot-base-environment ONLY, never *bot-base — the latter
  # carries `build.dockerfile: test/Dockerfile`, which would quietly build the
  # Hermes image. It needs its own build and user below. (See pi/README.md.)
  #
  # Starts as root for the same reason gateway does: the bind-mounted workspace and
  # pi/ dir are owned by the host uid, so a non-root process cannot write session
  # trees or repo checkouts there.
  # ──────────────────────────────────────────────────────
  pi:
    build:
      context: ..
      dockerfile: docker/pi/Dockerfile
    user: "0:0"
    # pi-gateway, NOT the image's default CMD. It serves the HTTP surface and spawns
    # one `pi --mode rpc` per profile with that profile's directory as cwd — which is
    # what makes each agent load its own AGENTS.md. Running the image default (`pi
    # --mode rpc` on stdio) starts a process that serves no port at all.
    # The entrypoint execs this, after its `pi mcp list` check.
    command: ["/usr/local/bin/pi-gateway"]
    ports:
      # HOST port only — the container always listens on 8643. Deliberately NOT
      # named PI_SERVER_PORT: that is the variable pi-gateway itself reads as its
      # bind port, so sharing the name invites the obvious wrong fix. Someone
      # debugging a port problem reaches for PI_SERVER_PORT, which would move only
      # this side; and if it were then also passed into the container, the listener
      # would move off the mapped port and out from under the healthcheck.
      # PI_HOST_PORT cannot collide with anything the binary reads.
      #
      # The app should go through the proxy (:8080) once nginx is pointed here.
      - "${PI_HOST_PORT:-8643}:8643"
    volumes:
      # The Pi agent dir: settings.json, mcp.json, AGENTS.md, profiles/<n>/.
      # Pi writes sessions/, auth.json and models-store.json here; all gitignored.
      - ../pi:/opt/pi
      # Repos the agent works in: workspace/portals (story), workspace/resumes.
      - ../workspace:/workspace
      # VPS SSH keys, least-privilege file mounts (read-only): story and resumes
      # clone and pull their own repos as the VPS GitHub identity. Without these
      # both profiles fail closed on the first clone with Permission denied
      # (publickey) — which is why their AGENTS.md says stop and report rather than
      # retry. Same mounts and same GIT_SSH_COMMAND as the gateway service.
      - ${VPS_SSH_DIR:-/root/.ssh}/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${VPS_SSH_DIR:-/root/.ssh}/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - ${VPS_SSH_DIR:-/root/.ssh}/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      # Mongo + the OpenCode keys, inherited so the two stacks cannot drift apart.
      #
      # This anchor also carries four Hermes variables — HERMES_HOME,
      # HERMES_ALLOW_ROOT_GATEWAY, HERMES_API_KEY, OPENCODE_ZEN_API_KEY. They are
      # INERT here: nothing in the pi image reads them, and HERMES_HOME=/opt/data is
      # meaningless in a container that mounts /opt/pi. They are inherited anyway on
      # purpose. Restating the environment explicitly would duplicate the Mongo and
      # provider-key wiring, and the failure mode of that duplication is the bug this
      # stack has been fighting throughout — someone adds a variable to the anchor
      # for Hermes and the pi service silently does not get it. Here a new variable
      # reaches both, and an unused one costs a few bytes.
      #
      # A genuinely required variable going missing is still loud: the entrypoint
      # dies if any MCP server fails to connect.
      <<: *bot-base-environment
      # Bearer token for the pi-gateway HTTP surface. Same value the app sends to
      # the Hermes gateway today, so a tab can be repointed without re-entering it.
      PASSWORD: ${PASSWORD:-}
      # Explicit rather than relying on the binary's default, because three separate
      # places have to agree on this number: here, the container side of the port
      # mapping, and the healthcheck's URL. None of the three is derived from the
      # others, so changing one means changing all three.
      #
      # Do NOT add PI_GATEWAY_ADDR to this service. It wins outright over
      # PI_SERVER_PORT (see cmd/pi-gateway/main.go), so setting it would move the
      # listener off the mapped port and out from under the healthcheck.
      PI_SERVER_PORT: "8643"
      PI_CODING_AGENT_DIR: /opt/pi
      PI_PROFILE_DIR: /opt/pi/profiles
      # Provider key name Pi itself reads.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # Fail-closed SSH for agent-run git, same as gateway: only the mounted key is
      # ever offered, never prompt, never trust unknown hosts (a GitHub key rotation
      # fails loudly until known_hosts is updated on the VPS).
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
    healthcheck:
      # /healthz is unauthenticated by design, so the probe needs no credential.
      # This URL is INSIDE the container, so it uses the container port (8643) and
      # never the host port — PI_HOST_PORT is not visible here. It must stay in step
      # with PI_SERVER_PORT above; neither is derived from the other.
      test: ["CMD", "curl", "-fsS", "http://localhost:8643/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Generous: the entrypoint runs `pi mcp list` before handing off, which
      # connects all five MCP servers. A short start_period reports unhealthy while
      # that is still in progress.
      start_period: 60s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → podman-compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    build:
      context: ..
      dockerfile: test/Dockerfile
    user: "1000:1000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    entrypoint: ["/usr/local/bin/retention"]
    restart: "no"

# The whole live stack: health-api, proxy and the one-shot retention job.
#
# The agent runtime is gone (#494). T3/opencode runs on the host and talks to
# the same MongoDB Atlas the phone does; this file no longer carries an agent
# service, an agent image or any PI_* variable.
#
# MONGODB_DB's default stays `hermes`: that is the name of the Atlas database,
# not a reference to the agent, and changing it would point the stack at an
# empty one.

services:

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # MONGODB_URI/PASSWORD from root .env.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ..
      dockerfile: docker/health-api/Dockerfile
    user: "1000:1000"
    ports:
      # HOST port only: the container always listens on 8000 (main.go Addr,
      # healthcheck URL), so change only the host mapping, never the
      # container side.
      - "${HEALTH_HOST_PORT:-8001}:8000"
    volumes:
      # VPS exports folder for mobile downloads (#26); read-only is enough.
      - ../exports:/exports:ro
    environment:
      # This service ingests Health Connect rows and writes them to MongoDB.
      # It never calls a model, so no provider credential belongs here.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      PASSWORD: ${PASSWORD:-}
      # Google connectors OAuth (#488): the connector routes live here
      # (list/connect/disconnect/callback), so all four travel with this
      # service — any piece missing leaves ConnectorOAuth nil and connect
      # answers 501. Each service reads its own copy from the root .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      CONNECTORS_ENCRYPTION_KEY: ${CONNECTORS_ENCRYPTION_KEY:-}
      # This service is a long-lived Go process whose heap is almost entirely
      # request-scoped, so halving the growth target is expected to cut its
      # resident set at a CPU cost this box is nowhere near paying — expected,
      # not measured (ADR-0011): treat the comment as the hypothesis. Set here
      # rather than in the Dockerfile so the value is visible next to the
      # other footprint knobs.
      GOGC: "50"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Proxy — single URL for the Agento app (sync only).
  # Routes /api/* + /health → health-api :8000.
  # App Server URL: http://<host>:${APP_PORT:-8080}.
  # Direct health-api stays published for comparison: :8001 — compose default;
  # HEALTH_HOST_PORT remaps the host side.
  # ──────────────────────────────────────────────────────
  proxy:
    # Pinned by tag, not by digest, and deliberately so: this image is
    # PULLED and run, not built from this repo, so there is no Dockerfile
    # here to keep the ARG and the digest in step. The tag names an exact
    # patch release, and the config it serves is ours (mounted below), so
    # what moves under us is the binary, not the routing.
    image: docker.io/nginx:1.31.8-alpine3.24
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Replaces the image's default server block (same server_name would
      # otherwise shadow ours for Host: localhost).
      - ../docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Short list form, and it has to be: `condition: service_started` is what a
      # Compose implementation would want here, but podman-compose builds its
      # dependency graph with `deps = {x: {} for x in deps}` and a mapping value is
      # an unhashable dict, so ANY `condition:` form — list or mapping syntax —
      # makes it die with `TypeError: cannot use 'dict' as a dict key` before it
      # reads a single service. Verified, both spellings.
      - health-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → podman-compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    # Its own minimal image: one Go binary plus ca-certificates, 18 MB. It used to
    # build from test/Dockerfile, the Hermes runtime, for a single binary — the last
    # thing keeping that image alive, and now deleted.
    build:
      context: ..
      dockerfile: docker/retention/Dockerfile
    user: "1000:1000"
    environment:
      # Same reasoning as health-api: Mongo only. This container prunes
      # collections and talks to no model.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      # No GOGC: one-shots are excluded from the footprint tuning on purpose.
      # This process runs for seconds and exits before GC pressure matters;
      # halving its growth target would buy unmeasurable bytes at the cost of
      # one more knob to keep in step.
    entrypoint: ["/usr/local/bin/retention"]
    restart: "no"

# ──────────────────────────────────────────────────────
# Shared service definition (env + build context for the bot image).
# ──────────────────────────────────────────────────────
x-bot-base: &bot-base
  build:
    context: ../test
  user: "1000:1000"
  volumes:
    - ../tools:/tools:ro
  environment: &bot-base-environment
    HERMES_HOME: /hermes-home
    HOME: /hermes-home
    OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
    HERMES_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    SEARXNG_URL: http://searxng:8080
    MONGODB_URI: ${MONGODB_URI:-}
    MONGODB_DB: ${MONGODB_DB:-hermes}
  restart: unless-stopped

services:

  # ──────────────────────────────────────────────────────
  # SearXNG — Private metasearch engine
  # ──────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    # run as root initially to create settings.yml on first run (volume is root-owned)
    user: "0:0"
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-}
    volumes:
      - searxng_data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # MONGODB_URI/HEALTH_SYNC_TOKEN from root .env.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ../docker/health-api
    user: "1000:1000"
    ports:
      - "8001:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      HEALTH_SYNC_TOKEN: ${HEALTH_SYNC_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Multiplexed gateway — ONE container serves story + resumes +
  # default (god) profiles with money/cookbook/health-check MCPs, plus
  # the built-in OpenAI-compatible API server (:8642) for the custom
  # Android app and the dashboard (:9119, s6-supervised).
  # HERMES_HOME (profiles/master) is the gateway home; story/resumes/
  # default are named profiles under profiles/master/profiles/. The
  # entrypoint renders each profile's config from these env vars.
  #
  # HERMES_DASHBOARD=1 runs dashboard alongside gateway in the SAME
  # container, supervised by s6 (mirrors official
  # nousresearch/hermes-agent where HERMES_DASHBOARD=1 enables the
  # dashboard s6 service). Port 9119 is exposed on this single service.
  #
  # ALL env comes from the single root .env (compose interpolation).
  # Deliberately NOT the whole root env (no host-oriented
  # SEARXNG_URL=localhost:8888, which would break web search in-container).
  # ──────────────────────────────────────────────────────
  gateway:
    <<: *bot-base
    # s6-overlay needs to start as root to s6-setuidgid 1000:1000 for services;
    # running the container as 1000:1000 breaks s6-applyuidgid (dashboard 9119 reset).
    user: "0:0"
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
      - "${API_SERVER_PORT:-8642}:8642"
    volumes:
      - ../profiles/master:/hermes-home
      - ../workspace:/workspace
      - ../tools:/tools:ro
      - ../mcps/common:/mcps/common:ro
      - ../mcps/cookbook:/mcps/cookbook:ro
      - ../mcps/health_check:/mcps/health_check:ro
      - ../mcps/money:/mcps/miser-money:ro
    environment:
      <<: *bot-base-environment
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      MONEY_DEFAULT_ACCOUNT: ${MONEY_DEFAULT_ACCOUNT:-Cash}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      PYTHONPATH: /mcps

  # ──────────────────────────────────────────────────────
  # Proxy — single URL for the Agento app (chat + sync on one port).
  # Routes /p/* → gateway :8642 and /api/* + /health → health-api :8000
  # (see docker/proxy/nginx.conf). App Server URL: http://<host>:${APP_PORT:-8080}.
  # Direct ports (:8642, :8001) stay published for backward compatibility.
  # ──────────────────────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../docker/proxy/nginx.conf:/etc/nginx/conf.d/agento.conf:ro
    depends_on:
      - gateway
      - health-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → docker compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../tools:/tools:ro
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    entrypoint: ["python3", "/tools/retention.py"]
    restart: "no"

  # ── Dev-only local MongoDB (ephemeral, HERMES_ENV=dev) ──────────
  # Activated via compose profile `dev` (COMPOSE_PROFILES=dev, set by
  # scripts/lib/common.sh when HERMES_ENV=dev). Prod never starts this.
  # No volume — fully ephemeral (data lost on `down`/`restart`), which is
  # intentional for temporary dev use.
  # Runs as a single-node replica set (rs0, initiated by mongodb-init
  # below) so multi-doc transactions work in dev exactly like prod Atlas.
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - dev

  # One-shot replica-set initiator for the dev mongodb (see above).
  # Exits 0 once rs.initiate() succeeds or the set is already initiated.
  mongodb-init:
    image: mongo:7
    profiles:
      - dev
    depends_on:
      - mongodb
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 30); do
          if mongosh --host mongodb --quiet --eval 'try { rs.initiate() } catch (e) { if (e.codeName !== "AlreadyInitialized") throw e }'; then
            break
          fi
          sleep 2
        done
    restart: "no"

volumes:
  searxng_data:
